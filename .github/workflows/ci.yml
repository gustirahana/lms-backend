name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Production entrypoint smoke
        run: npm run test:startup

      - name: Lint
        run: npm run lint

      - name: Auth session smoke
        run: npm run test:auth-session

      - name: Realtime smoke
        run: npm run test:realtime
